<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Temporarily Unavailable — StudiKitEZ</title>
<meta name="sk-maintenance" content="true" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/main.css" />
<style>
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
  .card { text-align: center; padding: 2rem; max-width: 420px; }
  .mark { font-size: 5rem; line-height: 1; margin-bottom: 1rem; opacity: 0.9; }
  h1 { font-family: var(--font-syne); font-size: 1.75rem; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.95rem; line-height: 1.5; }
  .safe { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--primary-dark); margin-bottom: 1.5rem; }
  .safe b { color: var(--ink); }
  .btn { display: inline-block; background: var(--ink); color: var(--bg); text-decoration: none; padding: 0.75rem 1.5rem; border-radius: var(--radius); font-weight: 700; font-size: 0.9rem; border: 1px solid var(--ink); }
  .btn:hover { opacity: 0.9; }
  .muted-note { margin-top: 1.5rem; font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div class="mark">⚠️</div>
  <h1>We're facing some trouble</h1>
  <p>Our content servers are having issues. We're working to fix it and will be back soon.</p>
  <div class="safe"><b>Your data is safe.</b> Nothing is lost — progress, notes, and keys are stored on your account.</div>
  <a href="index.html" class="btn">Go to Home</a>
  <p class="muted-note">Try refreshing in a few minutes. If this persists, contact support.</p>
</div>
</body>
</html>

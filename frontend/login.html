<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — StudiKitEZ</title>
<meta name="description" content="Sign in with Google or phone OTP." />
<meta name="robots" content="noindex, nofollow" />
<meta name="sk-backend" content="https://studikites.vercel.app" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark">S</span><span>StudiKitEZ</span></a>
    <nav class="nav-links" aria-label="Primary"><a href="index.html">Catalog</a><a href="app.html">App</a></nav>
    <span></span>
  </div>
</header>

<main class="page" id="main" style="display:flex;align-items:center;justify-content:center;min-height:80vh">
  <div class="panel anim-rise" style="width:100%;max-width:26rem">
    <div style="display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:1.25rem">
      <span class="brand-mark">S</span><strong>StudiKitEZ</strong>
    </div>
    <h1 style="text-align:center;font-size:1.35rem" id="form-title">Welcome back</h1>
    <p class="sub" style="text-align:center" id="authStatusText">Login to access your batches</p>
    <div id="authAlert" role="alert" style="display:none;margin-top:.9rem;padding:.7rem .9rem;border-radius:10px;border:1px solid;font-size:.85rem"></div>

    <button class="btn btn-primary btn-block" id="googleBtn" style="margin-top:1.1rem;background:#fff;color:var(--ink);border-color:var(--line)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.39 3.62v3h3.87c2.26-2.09 3.57-5.16 3.57-8.81z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.87-3c-1.07.72-2.44 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.29v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28v-3.1H1.29a12 12 0 0 0 0 10.76l3.98-3.1z"/><path fill="#EA4335" d="M12 4.77c1.76 0 3.34.61 4.58 1.8l3.44-3.44A11.98 11.98 0 0 0 12 0 12 12 0 0 0 1.29 6.62l3.98 3.1C6.22 6.88 8.87 4.77 12 4.77z"/></svg>
      Continue with Google
    </button>
    <p class="mono muted" style="font-size:.68rem;text-align:center;margin:.45rem 0 0">Fastest — one tap, no OTP</p>

    <div style="display:flex;align-items:center;gap:.75rem;margin:1.1rem 0;color:var(--muted);font-size:.75rem" aria-hidden="true">
      <span style="flex:1;height:1px;background:var(--line)"></span>or use phone<span style="flex:1;height:1px;background:var(--line)"></span>
    </div>

    <div id="authStep1">
      <label class="field" for="mobileInput">Mobile number (India)</label>
      <div style="display:flex;gap:.5rem">
        <span style="display:inline-flex;align-items:center;padding:0 .9rem;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:800">+91</span>
        <input id="mobileInput" class="input mono" type="tel" inputmode="numeric" maxlength="10" placeholder="98765 43210" autocomplete="tel" />
      </div>
      <button class="btn btn-primary btn-block" id="sendOtpBtn" style="margin-top:.9rem">Send OTP</button>
    </div>

    <div id="authStep2" hidden>
      <label class="field" for="otpInput">Enter OTP</label>
      <input id="otpInput" class="input mono" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code" style="text-align:center;letter-spacing:.35em;font-size:1.25rem" />
      <button class="btn btn-primary btn-block" id="verifyOtpBtn" style="margin-top:.9rem">Verify & Login</button>
      <div style="display:flex;gap:.5rem;margin-top:.5rem">
        <button class="btn btn-ghost btn-sm" id="resendBtn" style="flex:1">Resend OTP</button>
        <button class="btn btn-ghost btn-sm" id="backBtn" style="flex:1">Change number</button>
      </div>
    </div>

    <div id="authStep3" hidden>
      <p class="sub" style="text-align:center;margin-bottom:.9rem">New here? Set up your profile</p>
      <label class="field" for="nameInput">Your name</label>
      <input id="nameInput" class="input" type="text" placeholder="What should we call you?" autocomplete="name" />
      <label class="field" for="emailInput">Email (optional)</label>
      <input id="emailInput" class="input" type="email" placeholder="you@example.com" autocomplete="email" />
      <button class="btn btn-primary btn-block" id="saveProfileBtn" style="margin-top:.9rem">Save & Continue</button>
      <button class="btn btn-ghost btn-block btn-sm" id="skipProfileBtn" style="margin-top:.4rem">Skip for now</button>
    </div>

    <p class="mono muted" style="font-size:.65rem;text-align:center;margin-top:1.1rem">Banned accounts cannot access content.</p>
  </div>
</main>

<div id="toast-root" aria-live="polite"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/firebase.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function () {
  var ui = SK.ui, api = SK.api, fb = SK.fb;
  var qp = function (k) { return new URLSearchParams(location.search).get(k); };
  var next = qp("next") || "dashboard.html";
  var busy = false, mobile = "";
  fb.captureReferral();
  fb.currentUser().then(function (u) { if (u) location.replace(next); }).catch(function () {});

  function alert(msg, ok) {
    var box = document.getElementById("authAlert");
    box.style.display = "";    box.style.background = ok ? "var(--primary-soft)" : "var(--danger-soft)";
    box.style.borderColor = ok ? "var(--primary)" : "var(--danger)";
  box.style.color = ok ? "var(--primary-dark)" : "var(--danger)";
  box.textContent = String((msg && msg.message) || msg || "Something went wrong");
  }
  function hideAlert() { document.getElementById("authAlert").style.display = "none"; }
  function setBusy(btn, on, label) {
    btn.disabled = on;
    if (on) { btn.dataset.orig = btn.innerHTML; btn.innerHTML = '<span class="spinner" style="width:1rem;height:1rem;border-width:2px;margin:0"></span> ' + label; }
    else if (btn.dataset.orig) btn.innerHTML = btn.dataset.orig;
  }
  function showStep(n) {
    ["authStep1", "authStep2", "authStep3"].forEach(function (id, i) {
      document.getElementById(id).hidden = (i + 1) !== n;
    });
  }
  function routeAfter(uid) {
    fb.banCheck(uid).then(function () { setTimeout(function () { location.replace(next); }, 500); })
      .catch(function (e) {
        if (String(e.message).indexOf("BANNED:") === 0) location.replace("banned.html");
        else setTimeout(function () { location.replace(next); }, 500);
      });
  }

  async function doSend() {
    if (busy) return;
    var m = api.validMobile(document.getElementById("mobileInput").value);
    if (!m) { alert("Enter a valid 10-digit Indian mobile number."); return; }
    busy = true; hideAlert(); setBusy(document.getElementById("sendOtpBtn"), true, "Sending…");
    try {
      var r = await api.sendOtp(m, api.deviceId());
      mobile = m;
      if (r.deviceId) { try { localStorage.setItem("sk_device_id", r.deviceId); } catch (e) {} }
      document.getElementById("form-title").textContent = "Check your SMS";
      document.getElementById("authStatusText").textContent = "OTP sent to +91 " + m;
      showStep(2); alert("OTP sent — valid for a few minutes.", true);
      document.getElementById("otpInput").focus();
    } catch (e) { alert(e.message || "Failed to send OTP"); }
    setBusy(document.getElementById("sendOtpBtn"), false); busy = false;
  }
  document.getElementById("sendOtpBtn").addEventListener("click", doSend);
  document.getElementById("resendBtn").addEventListener("click", doSend);
  document.getElementById("backBtn").addEventListener("click", function () {
    showStep(1);
    document.getElementById("form-title").textContent = "Welcome back";
    document.getElementById("authStatusText").textContent = "Login to access your batches";
    hideAlert();
  });
  document.getElementById("otpInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("verifyOtpBtn").click();
  });

  document.getElementById("verifyOtpBtn").addEventListener("click", async function () {
    if (busy) return;
    var m = mobile || api.validMobile(document.getElementById("mobileInput").value);
    var otp = document.getElementById("otpInput").value.trim();
    if (!m) { alert("Enter a valid 10-digit Indian mobile number."); return; }
    if (!otp || otp.length < 4) { alert("Enter the OTP you received."); return; }
    busy = true; hideAlert(); setBusy(document.getElementById("verifyOtpBtn"), true, "Verifying…");
    try {
      var r = await api.verifyOtp(m, otp, api.deviceId());
      try { localStorage.setItem("studybee_token", r.data.accessToken); localStorage.setItem("studybee_mobile", m); if (r.session) localStorage.setItem("sk_session", r.session); } catch (e) {}
      await fb.syncPhone(m);
      await fb.consumeReferral("phone_" + m);
      var ex = await fb.checkPhone(m);
      if (ex.exists && ex.hasName) { ui.toast("Welcome back", "+91 " + m); routeAfter("phone_" + m); }
      else {
        document.getElementById("form-title").textContent = "Set up your profile";
        document.getElementById("authStatusText").textContent = "Welcome! Tell us a bit about yourself";
        showStep(3); hideAlert();
      }
    } catch (e) { alert(e.message || "Invalid OTP"); }
    setBusy(document.getElementById("verifyOtpBtn"), false); busy = false;
  });

  async function finish(save) {
    if (save && document.getElementById("nameInput").value.trim()) {
      await fb.saveProfile(mobile, document.getElementById("nameInput").value.trim(), document.getElementById("emailInput").value.trim()).catch(function () {});
      ui.toast("Profile saved", document.getElementById("nameInput").value.trim());
    }
    routeAfter("phone_" + mobile);
  }
  document.getElementById("saveProfileBtn").addEventListener("click", function () { finish(true); });
  document.getElementById("skipProfileBtn").addEventListener("click", function () { finish(false); });

  document.getElementById("googleBtn").addEventListener("click", async function () {
    if (busy) return;
    busy = true; hideAlert(); setBusy(document.getElementById("googleBtn"), true, "Opening Google…");
    try {
      var cfg = await api.getConfig();
      var appMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
      var authMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
      var app = appMod.getApps().find(function (a) { return a.name === "studiki"; }) || appMod.initializeApp(cfg.STUDIKI, "studiki");
      var cred = await authMod.signInWithPopup(authMod.getAuth(app), new authMod.GoogleAuthProvider());
      await fb.syncGoogle(cred.user);
      await fb.consumeReferral(cred.user.uid);
      ui.toast("Welcome", "Signed in with Google");
      routeAfter(cred.user.uid);
    } catch (e) {
      if (!e || e.code !== "auth/popup-closed-by-user") {
        alert(((e && e.code) ? String(e.code).replace("auth/", "").replace(/-/g, " ") : e.message) || "Google sign-in failed");
      }
    }
    setBusy(document.getElementById("googleBtn"), false); busy = false;
  });
})();
</script>
</body>
</html>

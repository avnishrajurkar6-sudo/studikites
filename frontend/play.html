<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lecture — StudiKitEZ</title>
<meta name="description" content="Watch the lecture distraction-free." />
<meta name="sk-backend" content="https://studikites.vercel.app" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/main.css" />
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  .player-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; align-items: start; }
  @media (min-width: 960px) { .player-grid { grid-template-columns: 2fr 1fr; } }
  .note-row { border: 1px solid var(--line); border-radius: 10px; padding: 0.6rem 0.75rem; margin-top: 0.5rem; background: var(--surface); }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark">S</span><span>StudiKitEZ</span></a>
    <nav class="nav-links" aria-label="Primary"><a href="index.html">Catalog</a><a href="dashboard.html">Dashboard</a><a href="focus.html">Focus Rooms</a></nav>
    <button class="btn btn-ghost btn-sm" id="back-btn">← Course</button>
  </div>
</header>

<main class="page" id="main"><div class="wrap">
  <span class="kicker">Lecture</span>
  <h1 id="doc-title" style="font-size:clamp(1.2rem,3vw,1.6rem)">Loading…</h1>

  <div class="player-grid" style="margin-top:1rem">
    <div>
      <div class="stage" id="stage">
        <video id="video" playsinline preload="metadata" style="display:none"></video>
        <div class="spin-veil" id="veil"><div class="spinner" role="status" aria-label="Loading video"></div></div>
      </div>
      <div class="ctl">
        <div class="seek" id="seek" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="track"><div class="buf" id="buf"></div><div class="fill" id="seekfill"></div><div class="knob" id="knob"></div></div>
        </div>
        <button class="iconbtn" id="play-btn" aria-label="Play or pause">▶</button>
        <button class="iconbtn" id="mute-btn" aria-label="Mute or unmute">♪</button>
        <input type="range" class="vol" id="vol" min="0" max="200" value="100" aria-label="Volume, past 100 is boost" title="Volume (past 100 = boost)" />
        <span class="mono muted" style="font-size:.75rem"><span id="t-cur">0:00</span> / <span id="t-dur">0:00</span></span>
        <span style="flex:1"></span>
        <button class="iconbtn" id="pip-btn" aria-label="Picture in picture" title="Picture-in-picture">⧉</button>
        <button class="iconbtn" id="speed-btn" aria-label="Playback speed" title="Speed">1×</button>
        <button class="iconbtn" id="fs-btn" aria-label="Fullscreen" title="Fullscreen">⛶</button>
        <button class="btn btn-secondary btn-sm" id="dl-btn">Download</button>
      </div>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.7rem;align-items:center">
        <span class="mono muted" style="font-size:.68rem">QUALITY</span>
        <span id="quals" style="display:flex;gap:.4rem;flex-wrap:wrap"></span>
      </div>

      <div class="ad-slot" data-ad="banner"><div class="ad-label">Advertisement</div></div>

      <section class="panel" style="margin-top:1rem">
        <h2 style="font-size:1rem">My notes</h2>
        <p class="sub">Timestamped, synced to your account.</p>
        <div style="display:flex;gap:.5rem;margin-top:.6rem">
          <input class="input" id="note-input" placeholder="Note for this moment…" maxlength="500" aria-label="Add a note" />
          <button class="btn btn-secondary" id="note-save">Save</button>
        </div>
        <div id="notes-list"></div>
      </section>
    </div>

    <aside style="display:flex;flex-direction:column;gap:1rem">
      <section class="panel" style="margin-top:0">
        <h2 style="font-size:1rem">Up next</h2>
        <div id="upnext"><span class="muted">Loading…</span></div>
      </section>
      <section class="panel" style="margin-top:0">
        <h2 style="font-size:1rem">Lecture chat <span class="mono muted" style="font-size:.65rem">· 12h</span></h2>
        <div id="chat-msgs" style="max-height:16rem;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem" aria-live="polite"></div>
        <div style="display:flex;gap:.5rem;margin-top:.6rem">
          <input class="input" id="chat-input" placeholder="Say something…" maxlength="300" aria-label="Chat message" />
          <button class="btn btn-primary btn-sm" id="chat-send" aria-label="Send">➤</button>
        </div>
      </section>
    </aside>
  </div>
</div></main>

<div id="toast-root" aria-live="polite"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/firebase.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/ads.js"></script>
<script>
(function () {
  var ui = SK.ui, api = SK.api, fb = SK.fb;
  var qp = function (k) { return new URLSearchParams(location.search).get(k); };
  var courseId = qp("course") || qp("courseId") || "", contentId = qp("content") || qp("contentId") || "", folderId = qp("folder") || "0";
  var user = null, play = null, hls = null;
  var video = document.getElementById("video");
  /* Title resolution: URL hint (from the content grid) -> cached list item ->
     backend payload -> generic fallback. Videos come from /vc/{vdc_id}, which
     returns no title, so the hint is usually what names the lecture. */
  var cachedItem = null;
  try { cachedItem = JSON.parse(sessionStorage.getItem("player_" + courseId + "_" + contentId) || "null"); } catch (e) { cachedItem = null; }
  var hintedTitle = String(qp("title") || (cachedItem && cachedItem.title) || "").trim();
  function setTitle(t) {
    var name = String(t || "").trim();
    if (!name) return;
    document.getElementById("doc-title").textContent = name;
    document.title = "StudiKitEZ — " + name;
  }
  if (hintedTitle) setTitle(hintedTitle);
  ui.boot({ status: "Loading lecture…" }).catch(function () {});
  ui.nav(); ui.telegram(); ui.telegramNag();
  document.getElementById("back-btn").addEventListener("click", function () {
    location.href = "content.html?id=" + courseId + (folderId && folderId !== "0" ? "&path=" + folderId : "");
  });
  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

  fb.currentUser().then(function (u) { user = u; }).catch(function () {});
  ui.load(true);
  fb.ensure().then(bootWithKey).then(function () { ui.load(false); }).catch(function () {
    ui.load(false);
    document.getElementById("stage").innerHTML = '<div style="position:absolute;inset:0;display:flex;flex-direction:column;gap:.6rem;align-items:center;justify-content:center;padding:2rem;text-align:center"><h2>Backend unreachable</h2><p class="muted">Set the backend URL and check connection, then retry.</p><button class="btn btn-primary btn-sm" onclick="location.reload()">Retry</button></div>';
  });
  async function bootWithKey() {
    var key;
    try { key = await fb.mintKey(); }
    catch (e) {
      document.getElementById("stage").innerHTML = '<div style="position:absolute;inset:0;display:flex;flex-direction:column;gap:.6rem;align-items:center;justify-content:center;padding:2rem;text-align:center"><h2>Sign-in service unreachable</h2><p class="muted">Playback keys need the backend + Firebase. Check connection and retry.</p><button class="btn btn-primary btn-sm" onclick="location.reload()">Retry</button></div>';
      return;
    }
    if (!user) {
      var ok = await api.isFreePreview(courseId, contentId).catch(function () { return false; });
      if (!ok) {
        ui.toast("Sign in required", "First lecture is free — sign in for the rest");
        var selfNext = "play.html?course=" + courseId + "&content=" + contentId +
          "&folder=" + encodeURIComponent(folderId) +
          (qp("vdc_id") ? "&vdc_id=" + encodeURIComponent(qp("vdc_id")) : "") +
          (hintedTitle ? "&title=" + encodeURIComponent(hintedTitle) : "");
        setTimeout(function () { location.href = "login.html?next=" + encodeURIComponent(selfNext); }, 700);
        return;
      }
      ui.toast("Free preview", "First lecture is free");
    }
    try {
      var headers = await fb.authHeaders().catch(function () { return {}; });
      var vdcId = qp("vdc_id") || "";
      play = await api.play(courseId, contentId, key.key, key.deviceId, headers, vdcId, hintedTitle);
      console.log("[PLAY] API result:", play);
      if (!play || !play.file_url) throw new Error(play && play.error ? play.error : "No video URL returned");
    } catch (e) {
      console.error("[PLAY] Failed:", e.message);
      location.href = "maintenance.html?reason=" + encodeURIComponent(e.message || "playback_failed");
      return;
    }
    /* Video was requested but the source turned out to be a PDF — hand off. */
    if (Number(play.file_type) === 1 && !/\.(m3u8|mp4|mpd|webm)(\?|#|$)/i.test(play.file_url || "")) {
      location.replace("pdf.html?course=" + courseId + "&content=" + contentId +
        (qp("vdc_id") ? "&vdc_id=" + encodeURIComponent(qp("vdc_id")) : "") +
        "&title=" + encodeURIComponent(play.title || hintedTitle || ""));
      return;
    }
    var finalTitle = String(play.title || hintedTitle || "Lecture").trim();
    console.log("[PLAY] file_url:", play.file_url, "file_type:", play.file_type, "title:", finalTitle);
    setTitle(finalTitle);
    SK.fb.presenceBeat(undefined, "watching · " + finalTitle);
    attach(play.file_url);
    loadUpNext(); loadNotes(); loadChat(); setInterval(loadChat, 8000);
    SK.ads.render();
  }

  /* Inline player error — never hijack the page once playback is possible. */
  function playerError(msg) {
    var veil = document.getElementById("veil");
    if (veil) veil.classList.add("hide");
    var stage = document.getElementById("stage");
    var box = document.getElementById("stage-error");
    if (!box) {
      box = document.createElement("div");
      box.id = "stage-error";
      box.style.cssText = "position:absolute;inset:0;display:flex;flex-direction:column;gap:.6rem;align-items:center;justify-content:center;padding:2rem;text-align:center;background:var(--surface);z-index:5";
      stage.appendChild(box);
    }
    box.innerHTML = '<h2 style="margin:0">Stream hiccup</h2>' +
      '<p class="muted" style="margin:0;max-width:32ch">' + ui.esc(msg || "The lecture stream stopped responding.") + "</p>" +
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center">' +
      '<button class="btn btn-primary btn-sm" id="stage-retry">Resume</button>' +
      '<button class="btn btn-secondary btn-sm" id="stage-reload">Reload</button></div>';
    document.getElementById("stage-retry").addEventListener("click", function () {
      if (hls) { try { hls.startLoad(); } catch (e) {} }
      else if (play && play.file_url) { video.load(); video.play().catch(function () {}); }
      box.remove();
    });
    document.getElementById("stage-reload").addEventListener("click", function () { location.reload(); });
  }

  function attach(url) {
    console.log("[PLAY] attach() called with:", url);
    var yt = !/\.(m3u8|mp4)/i.test(url) && (/^[A-Za-z0-9_-]{11}$/.test(url) || /youtube\.com|youtu\.be/.test(url));
    if (yt) {
      var id = /^[A-Za-z0-9_-]{11}$/.test(url) ? url : ((url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/) || [])[1]);
      document.getElementById("stage").innerHTML = '<iframe src="https://www.youtube.com/embed/' + id + '?rel=0&modestbranding=1" allowfullscreen title="Lecture"></iframe>';
      return;
    }
    video.style.display = "block";

    /* Streams are long EVENT playlists on CloudFront; start at the beginning
       and keep a big back buffer so seeking backwards does not re-fetch. */
    if (/\.m3u8($|\?)/.test(url) && window.Hls && Hls.isSupported()) {
      hls = new Hls({
        maxBufferLength: 60,
        maxMaxBufferLength: 120,
        backBufferLength: 90,
        startPosition: 0,
        manifestLoadingTimeOut: 20000,
        manifestLoadingMaxRetry: 4,
        levelLoadingMaxRetry: 4,
        fragLoadingMaxRetry: 6
      });
      var recovered = 0;
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        var box = document.getElementById("quals");
        box.innerHTML = '<button class="qpill on" data-q="-1">Auto</button>' +
          (hls.levels || []).map(function (l, i) { return '<button class="qpill" data-q="' + i + '">' + l.height + 'p</button>'; }).join("");
        box.querySelectorAll("button").forEach(function (b) {
          b.addEventListener("click", function () {
            hls.currentLevel = Number(b.dataset.q);
            box.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
          });
        });
        console.log("[PLAY] manifest parsed, levels:", (hls.levels || []).length);
      });
      /* hls.js reports MANY non-fatal errors (level switches, buffer holes,
         segment retries) that it recovers from on its own. Only fatal ones
         need us, and even then we retry before showing an error. */
      hls.on(Hls.Events.ERROR, function (ev, data) {
        var detail = (data && data.details) || "unknown";
        var fatal = !!(data && data.fatal);
        console.warn("[PLAY] HLS error:", (data && data.type) || "", detail, "fatal=" + fatal);
        if (!fatal) return;
        if (data.type === Hls.ErrorTypes.MEDIA_ERROR && recovered < 2) {
          recovered++;
          console.warn("[PLAY] recovering media error, attempt " + recovered);
          setTimeout(function () { try { hls.recoverMediaError(); } catch (e) {} }, 300);
          return;
        }
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR && recovered < 3) {
          recovered++;
          console.warn("[PLAY] retrying network load, attempt " + recovered);
          setTimeout(function () { try { hls.startLoad(); } catch (e) {} }, 800 * recovered);
          return;
        }
        playerError("The lecture stream stopped. Tap Resume to continue from here.");
      });
      hls.loadSource(url);
      hls.attachMedia(video);
      video.addEventListener("error", function () {
        if (video.error) playerError("This lecture could not be decoded by your browser.");
      });
    } else {
      console.log("[PLAY] Setting direct video.src:", url);
      video.src = url;
      video.load();
      video.addEventListener("error", function () {
        playerError("This file could not be loaded. Check your connection and tap Resume.");
      });
      document.getElementById("quals").innerHTML = '<span class="mono muted" style="font-size:.7rem">progressive · auto</span>';
    }
  }

  document.getElementById("play-btn").addEventListener("click", function () {
    if (video.style.display === "none") return;
    if (video.paused) video.play().catch(function () {}); else video.pause();
  });
  video.addEventListener("play", function () { document.getElementById("play-btn").textContent = "⏸"; });
  video.addEventListener("pause", function () { document.getElementById("play-btn").textContent = "▶"; });
  video.addEventListener("timeupdate", function () {
    document.getElementById("t-cur").textContent = fmt(video.currentTime);
    var pct = video.duration ? (video.currentTime / video.duration) * 100 : 0;
    document.getElementById("seekfill").style.width = pct + "%";
    document.getElementById("knob").style.left = pct + "%";
    document.getElementById("seek").setAttribute("aria-valuenow", Math.round(pct));
    try {
      var b = video.buffered;
      if (b.length && video.duration) document.getElementById("buf").style.width = (b.end(b.length - 1) / video.duration) * 100 + "%";
    } catch (e) {}
    if (user && video.duration && Date.now() - (video._p || 0) > 15000) {
      video._p = Date.now();
      fb.saveProgress(user.uid, courseId, contentId, { pct: Math.min(99, Math.round((video.currentTime / video.duration) * 100)), title: play.title, type: "video" }).catch(function () {});
    }
  });
  video.addEventListener("loadedmetadata", function () { document.getElementById("t-dur").textContent = fmt(video.duration); });
  video.addEventListener("ended", function () {
    if (user) fb.saveProgress(user.uid, courseId, contentId, { pct: 100, title: play.title, type: "video", done: true }).catch(function () {});
    ui.toast("Lecture complete ✓", "+10 XP");
  });
  var speeds = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2], si = 2;
  document.getElementById("speed-btn").addEventListener("click", function () {
    si = (si + 1) % speeds.length; video.playbackRate = speeds[si];
    document.getElementById("speed-btn").textContent = speeds[si] + "×";
  });
  document.getElementById("pip-btn").addEventListener("click", function () {
    if (document.pictureInPictureElement) document.exitPictureInPicture().catch(function () {});
    else if (video.requestPictureInPicture) video.requestPictureInPicture().catch(function () { ui.toast("PiP unavailable", ""); });
  });
  document.getElementById("fs-btn").addEventListener("click", function () {
    var st = document.getElementById("stage");
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
    else if (st.requestFullscreen) st.requestFullscreen().catch(function () {});
  });
  /* Fullscreen: move the REAL control bar inside the stage so every button
     works there; auto-hide on idle, show on any pointer move. */
  var ctlEl = document.querySelector(".ctl"), ctlHome = ctlEl ? ctlEl.parentNode : null, ctlNext = ctlEl ? ctlEl.nextSibling : null, idleTimer = null;
  function pokeControls() {
    var st = document.getElementById("stage");
    st.classList.remove("idle");
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      if (document.fullscreenElement) st.classList.add("idle");
    }, 3000);
  }
  document.addEventListener("fullscreenchange", function () {
    var st = document.getElementById("stage");
    if (document.fullscreenElement === st) {
      st.classList.add("in-fs");
      if (ctlEl) st.appendChild(ctlEl);
      pokeControls();
      st.addEventListener("pointermove", pokeControls);
    } else {
      st.classList.remove("in-fs", "idle");
      st.removeEventListener("pointermove", pokeControls);
      if (ctlEl && ctlHome) ctlHome.insertBefore(ctlEl, ctlNext);
      if (idleTimer) clearTimeout(idleTimer);
    }
  });
  /* Double-click zones: left −10s, right +10s, center play/pause — with ripple. */
  function flashSeek(text, xPct) {
    var st = document.getElementById("stage");
    var f = document.createElement("div");
    f.className = "seek-flash";
    f.style.left = xPct + "%";
    f.textContent = text;
    st.appendChild(f);
    setTimeout(function () { f.remove(); }, 750);
  }
  function skipBy(sec, xPct) {
    if (!video.duration) return;
    video.currentTime = Math.min(Math.max(0, video.currentTime + sec), video.duration);
    flashSeek((sec > 0 ? "+" : "−") + Math.abs(sec) + "s", xPct);
  }
  document.getElementById("stage").addEventListener("dblclick", function (e) {
    if (video.style.display === "none") return;
    if (e.target.closest && e.target.closest(".ctl, .seek-flash")) return;
    var r = this.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width;
    if (x < 0.35) skipBy(-10, 22);
    else if (x > 0.65) skipBy(10, 78);
    else document.getElementById("play-btn").click();
  });
  video.addEventListener("playing", function () { document.getElementById("veil").classList.add("hide"); });
  video.addEventListener("waiting", function () { document.getElementById("veil").classList.remove("hide"); });
  video.addEventListener("canplay", function () { document.getElementById("veil").classList.add("hide"); });
  function seekTo(clientX) {
    var r = document.getElementById("seek").getBoundingClientRect();
    var p = Math.min(Math.max(0, (clientX - r.left) / r.width), 1);
    if (video.duration) video.currentTime = p * video.duration;
  }
  document.getElementById("seek").addEventListener("pointerdown", function (e) {
    seekTo(e.clientX);
    var move = function (ev) { seekTo(ev.clientX); };
    var up = function () { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  });
  document.getElementById("seek").addEventListener("keydown", function (e) {
    if (!video.duration) return;
    if (e.key === "ArrowRight") video.currentTime = Math.min(video.duration, video.currentTime + 10);
    if (e.key === "ArrowLeft") video.currentTime = Math.max(0, video.currentTime - 10);
  });
  try {
    var sv = parseFloat(localStorage.getItem("sk_vol") || "1");
    if (!isNaN(sv)) video.volume = Math.max(0, Math.min(1, sv));
  } catch (e) {}
  /* Volume boost past 100%: routes audio through a gain node (built only
     on demand, so normal playback is untouched). Toggle back under 100
     to restore the native path. */
  var boostChain = null;
  function killBoost() {
    if (!boostChain) return;
    try { boostChain.src.disconnect(); boostChain.gain.disconnect(); } catch (e) {}
    try { boostChain.ctx.close(); } catch (e) {}
    boostChain = null;
  }
  function ensureBoost() {
    if (boostChain) return true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      var ctx = new AC();
      if (ctx.state === "suspended") ctx.resume().catch(function () {});
      var src = ctx.createMediaElementSource(video);
      var gain = ctx.createGain();
      gain.gain.value = 1;
      src.connect(gain); gain.connect(ctx.destination);
      boostChain = { ctx: ctx, src: src, gain: gain };
      return true;
    } catch (e) { return false; }
  }
  function paintVol(nativePct) {
    var slider = document.getElementById("vol");
    var v = nativePct !== undefined ? nativePct : Number(slider.value);
    var muted = video.muted || v === 0;
    document.getElementById("mute-btn").textContent = muted ? "✕" : (v > 100 ? "♪+" : "♪");
    if (nativePct === undefined) slider.value = v;
  }
  document.getElementById("mute-btn").addEventListener("click", function () {
    if (boostChain) {
      var g = boostChain.gain.gain.value > 0;
      boostChain.remembered = g ? boostChain.gain.gain.value : (boostChain.remembered || 1.5);
      boostChain.gain.gain.value = g ? 0 : boostChain.remembered;
      try { localStorage.setItem("sk_vol", String(g ? 0 : boostChain.remembered)); } catch (e) {}
      paintVol(g ? 0 : Math.round(boostChain.remembered * 100));
      return;
    }
    video.muted = !video.muted;
    try { localStorage.setItem("sk_vol", String(video.muted ? 0 : video.volume)); } catch (e) {}
    paintVol();
  });
  document.getElementById("vol").addEventListener("input", function (e) {
    var pct = Math.max(0, Math.min(200, Number(e.target.value) || 0));
    var v = pct / 100;
    try { localStorage.setItem("sk_vol", String(v)); } catch (err) {}
    if (v <= 1) {
      killBoost();
      video.volume = v; video.muted = v === 0;
      paintVol(pct);
      return;
    }
    video.volume = 1; video.muted = false;
    if (!ensureBoost()) {
      e.target.value = 100; video.volume = 1;
      paintVol(100);
      ui.toast("Boost unavailable", "This browser blocked audio boost");
      return;
    }
    boostChain.gain.gain.value = v;
    paintVol(pct);
    if (v > 1 && !boostChain.warned) {
      boostChain.warned = true;
      ui.toast("Volume boost on", "Past 100% may distort on some lectures");
    }
  });
  paintVol();
  document.getElementById("dl-btn").addEventListener("click", async function () {
    var btn = this;
    var links = api.parseLinks(play), url = (links[0] && links[0].url) || (play && play.file_url);
    if (!url) { ui.toast("Nothing to download", ""); return; }
    if (/youtube\.com|youtu\.be|^[A-Za-z0-9_-]{11}$/.test(url)) { ui.toast("Download unavailable", "YouTube lectures can't be downloaded"); return; }
    if (/\.m3u8($|\?)/i.test(url) && !links.length) { ui.toast("Stream only", "This lecture has no downloadable file"); return; }
    /* Same-site download: fetch through OUR page (auth headers attached),
       save the blob — no redirect, no new tab. Falls back to direct link. */
    btn.disabled = true;
    var old = btn.textContent; btn.textContent = "Preparing…";
    try {
      var headers = await fb.authHeaders().catch(function () { return {}; });
      var c = new AbortController();
      var timer = setTimeout(function () { c.abort(); }, 60000);
      var res = await fetch(url, { headers: headers, signal: c.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error("HTTP " + res.status);
      var blob = await res.blob();
      var ext = /\.mp4/i.test(url) ? ".mp4" : (/\.pdf/i.test(url) ? ".pdf" : ".mp4");
      var name = String((play && play.title) || "lecture").replace(/[\\/:*?"<>|]/g, "").slice(0, 80) + ext;
      var obj = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = obj; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(obj); }, 5000);
      btn.textContent = "Saved ✓";
      ui.toast("Downloaded", name);
    } catch (e) {
      var a2 = document.createElement("a");
      a2.href = url; a2.target = "_blank"; a2.rel = "noopener"; a2.download = (play.title || "lecture") + ".mp4";
      document.body.appendChild(a2); a2.click(); a2.remove();
      ui.toast("Direct link opened", "Site download blocked by the file host");
    }
    btn.disabled = false;
    setTimeout(function () { btn.textContent = old; }, 2500);
  });
  document.addEventListener("keydown", function (e) {
    if (/INPUT|TEXTAREA/.test(e.target.tagName) || video.style.display === "none") return;
    if (e.code === "Space") { e.preventDefault(); document.getElementById("play-btn").click(); }
    if (e.code === "ArrowRight") video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
    if (e.code === "ArrowLeft") video.currentTime = Math.max(0, video.currentTime - 10);
    if (e.code === "KeyF") document.getElementById("fs-btn").click();
    if (e.code === "KeyM") document.getElementById("mute-btn").click();
  });

  async function loadUpNext() {
    var host = document.getElementById("upnext");
    try {
      var items = await api.content(courseId, folderId);
      var files = items.filter(function (x) { return x.type === "file"; });
      var i = files.findIndex(function (f) { return String(f.entity_id) === String(contentId); });
      /* Last-resort title: the folder listing knows this file's real name. */
      if (i >= 0 && files[i].title && (!play || !play.title) && !hintedTitle) {
        setTitle(files[i].title);
        SK.fb.presenceBeat(undefined, "watching · " + files[i].title);
      }
      var next = i >= 0 ? files.slice(i + 1, i + 4) : files.slice(0, 3);
      host.innerHTML = next.length ? "" : '<p class="muted">End of this folder. 🎉</p>';
      next.forEach(function (f) {
        var b = document.createElement("button");
        b.className = "btn btn-secondary btn-sm btn-block";
        b.style.marginTop = ".5rem"; b.style.justifyContent = "flex-start";
        b.textContent = ((f.data && Number(f.data.file_type) === 1) ? "▤ " : "▶ ") + f.title;
        b.addEventListener("click", function () {
          var page = (Number(f.data && f.data.file_type) === 1) ? "pdf.html" : "play.html";
          var vdc = (f.data && f.data.vdc_id) ? "&vdc_id=" + encodeURIComponent(String(f.data.vdc_id)) : "";
          location.href = page + "?course=" + courseId + "&content=" + f.entity_id +
            "&folder=" + encodeURIComponent(folderId) + vdc + "&title=" + encodeURIComponent(f.title || "");
        });
        host.appendChild(b);
      });
    } catch (e) { host.innerHTML = '<p class="muted">Up next unavailable.</p>'; }
  }
  async function loadNotes() {
    var host = document.getElementById("notes-list");
    var notes = await fb.listNotes(courseId, contentId);
    host.innerHTML = notes.length ? "" : '<p class="muted" style="font-size:.85rem;margin-top:.5rem">No notes yet — jot one down.</p>';
    notes.forEach(function (n) {
      var el = document.createElement("div");
      el.className = "note-row";
      el.innerHTML = '<span class="mono" style="font-size:.65rem;color:var(--primary-dark)"></span><div></div>';
      el.querySelector("span").textContent = n.at || "";
      el.querySelector("div").textContent = n.note || "";
      host.appendChild(el);
    });
  }
  document.getElementById("note-save").addEventListener("click", async function () {
    var t = document.getElementById("note-input").value.trim();
    if (!t) return;
    if (!user) { ui.toast("Sign in required", "Notes sync to your account"); return; }
    try {
      await fb.saveNote(courseId, contentId, fmt(video.currentTime || 0), t);
      document.getElementById("note-input").value = "";
      loadNotes(); ui.toast("Saved ✓", "");
    } catch (e) { ui.toast("Save failed", ""); }
  });
  async function loadChat() {
    var host = document.getElementById("chat-msgs");
    var list = await fb.listChat(courseId, contentId);
    host.innerHTML = list.length ? "" : '<p class="muted" style="font-size:.85rem">No messages yet — say hi. 👋</p>';
    list.forEach(function (m) {
      var el = document.createElement("div");
      el.style.fontSize = ".85rem";
      el.innerHTML = '<span class="mono muted" style="font-size:.65rem"></span> <span></span>';
      el.children[0].textContent = m.name || "learner";
      el.children[1].textContent = m.text || "";
      host.appendChild(el);
    });
    host.scrollTop = host.scrollHeight;
  }
  document.getElementById("chat-send").addEventListener("click", async function () {
    var t = document.getElementById("chat-input").value.trim();
    if (!t) return;
    if (!user) { ui.toast("Sign in required", ""); return; }
    try { await fb.sendChat(courseId, contentId, t); document.getElementById("chat-input").value = ""; loadChat(); }
    catch (e) { ui.toast("Couldn't send", ""); }
  });

  /* Feedback popup — fires every 10 minutes of actual watch time. */
  var watched = 0, lastT = 0, fbShown = 0;
  video.addEventListener("timeupdate", function () {
    var t = video.currentTime || 0;
    if (!video.paused && !video.seeking && lastT && t > lastT && t - lastT < 5) watched += (t - lastT);
    lastT = t;
    var mark = Math.floor(watched / 600);
    if (mark > fbShown && !document.querySelector(".modal")) {
      fbShown = mark;
      var key = "sk_fbk_" + contentId + "_" + fb.dayKey();
      var n = 0;
      try { n = parseInt(localStorage.getItem(key) || "0", 10) || 0; } catch (e) {}
      if (n < 3) { try { localStorage.setItem(key, String(n + 1)); } catch (e) {} feedbackPopup(); }
    }
  });
  function feedbackPopup() {
    var rating = 0;
    var m = ui.modal(
      '<span class="kicker">Quick feedback</span>' +
      '<h3 style="margin:.5rem 0 .35rem">How\'s this lecture?</h3>' +
      '<p class="muted" style="margin:0 0 .9rem;font-size:.88rem">10 minutes in — your rating shapes what we fix and film next.</p>' +
      '<div class="stars" id="fb-stars" role="radiogroup" aria-label="Rating out of 5">' +
        '<button type="button" class="star" data-v="1" aria-label="1 star">★</button>' +
        '<button type="button" class="star" data-v="2" aria-label="2 stars">★</button>' +
        '<button type="button" class="star" data-v="3" aria-label="3 stars">★</button>' +
        '<button type="button" class="star" data-v="4" aria-label="4 stars">★</button>' +
        '<button type="button" class="star" data-v="5" aria-label="5 stars">★</button>' +
      "</div>" +
      '<div class="mono muted" id="fb-hint" style="font-size:.65rem;margin-top:.3rem">tap the stars</div>' +
      '<textarea class="input" id="fb-improve" rows="2" maxlength="300" placeholder="What to improve?" style="margin-top:.8rem;font-size:.85rem"></textarea>' +
      '<textarea class="input" id="fb-add" rows="2" maxlength="300" placeholder="What should we add?" style="margin-top:.5rem;font-size:.85rem"></textarea>' +
      '<div style="display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap">' +
        '<button class="btn btn-primary btn-sm" id="fb-send" disabled>Send feedback</button>' +
        '<button class="btn btn-ghost btn-sm" id="fb-x">Not now</button>' +
      "</div>");
    m.querySelectorAll(".star").forEach(function (s) {
      s.addEventListener("click", function () {
        rating = Number(s.dataset.v);
        m.querySelectorAll(".star").forEach(function (x) { x.classList.toggle("on", Number(x.dataset.v) <= rating); });
        document.getElementById("fb-hint").textContent = rating + " / 5";
        document.getElementById("fb-send").disabled = false;
      });
      s.addEventListener("mouseenter", function () {
        m.querySelectorAll(".star").forEach(function (x) { x.classList.toggle("hov", Number(x.dataset.v) <= Number(s.dataset.v) && !x.classList.contains("on")); });
      });
      s.addEventListener("mouseleave", function () {
        m.querySelectorAll(".star").forEach(function (x) { x.classList.remove("hov"); });
      });
    });
    document.getElementById("fb-x").addEventListener("click", function () { ui.closeModal(); });
    document.getElementById("fb-send").addEventListener("click", function () {
      if (!rating) return;
      var improve = document.getElementById("fb-improve").value.trim();
      var addTxt = document.getElementById("fb-add").value.trim();
      this.disabled = true; this.textContent = "Sending…";
      var btn = this;
      fb.ensure().then(function () {
        var r = fb.raw();
        return r.S._fs.addDoc(r.S._fs.collection(r.S.sDb, "feedback"), {
          uid: user ? user.uid : "guest",
          courseId: String(courseId), contentId: String(contentId),
          title: (play && play.title) || "",
          rating: rating, improve: improve, add: addTxt, at: Date.now()
        });
      }).then(function () {
        ui.closeModal();
        ui.toast("Thanks! ✓", "Sent — this directly shapes the next batch");
      }).catch(function () {
        ui.closeModal();
        ui.toast("Couldn't send", "Try again or use the contact page");
      });
      void btn;
    });
  }
})();
</script>

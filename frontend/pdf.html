<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notes — StudiKitEZ</title>
<meta name="description" content="Read PDF notes with zoom and annotations." />
<meta name="sk-backend" content="https://studikites.vercel.app" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/main.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark">S</span><span>StudiKitEZ</span></a>
    <nav class="nav-links" aria-label="Primary"><a href="index.html">Catalog</a><a href="dashboard.html">Dashboard</a></nav>
    <button class="btn btn-ghost btn-sm" id="back-btn">← Course</button>
  </div>
</header>

<main class="page" id="main"><div class="wrap">
  <span class="kicker">PDF notes</span>
  <h1 id="doc-title" style="font-size:clamp(1.2rem,3vw,1.6rem)">Loading…</h1>

  <div style="display:flex;gap:.5rem;margin:1rem 0;flex-wrap:wrap">
    <button class="btn btn-secondary btn-sm" id="pdf-open">Open ↗</button>
    <button class="btn btn-secondary btn-sm" id="pdf-dl">Download</button>
    <span style="flex:1"></span>
    <span class="mono muted" style="font-size:.75rem;align-self:center" id="pdf-meta">— pages</span>
  </div>

  <div class="ctl draw-toolbar" style="border:1px solid var(--line);border-radius:var(--radius);margin-bottom:.75rem">
    <button class="qpill" id="draw-toggle" aria-pressed="false" title="Draw on pages">✏️ Draw</button>
    <span id="draw-tools" style="display:none;gap:.4rem;align-items:center;flex-wrap:wrap">
      <button class="qpill on" data-c="#111111" style="min-width:2.2rem" title="Black">●</button>
      <button class="qpill" data-c="#c81e1e" style="min-width:2.2rem;color:#c81e1e" title="Red">●</button>
      <button class="qpill" data-c="#1d4ed8" style="min-width:2.2rem;color:#1d4ed8" title="Blue">●</button>
      <button class="qpill" data-w="2">Thin</button>
      <button class="qpill on" data-w="4">Med</button>
      <button class="qpill" data-w="7">Thick</button>
      <button class="qpill" id="draw-clear" title="Erase this page">⌫ page</button>
    </span>
    <span class="mono muted" id="draw-hint" style="font-size:.65rem;display:none">drawings save on this device only</span>
  </div>

  <div class="pdf-stage" id="pdf-stage" aria-label="Document pages"><div class="spinner" role="status"></div></div>

  <div class="ctl" style="border:1px solid var(--line);border-radius:var(--radius);margin-top:.75rem">
    <button class="iconbtn" id="pg-prev" aria-label="Previous page">‹</button>
    <input class="input mono" id="pg-input" value="1" inputmode="numeric" style="width:4rem;text-align:center" aria-label="Page number" />
    <span class="mono muted" style="font-size:.75rem">/ <span id="pg-total">—</span></span>
    <button class="iconbtn" id="pg-next" aria-label="Next page">›</button>
    <span style="flex:1"></span>
    <button class="iconbtn" id="zoom-out" aria-label="Zoom out">−</button>
    <button class="qpill" id="zoom-fit">Fit</button>
    <button class="iconbtn" id="zoom-in" aria-label="Zoom in">+</button>
  </div>

  <section class="panel" style="margin-top:1rem">
    <h2 style="font-size:1rem">Page notes</h2>
    <div style="display:flex;gap:.5rem;margin-top:.6rem">
      <input class="input" id="note-input" placeholder="Note for this page…" maxlength="500" aria-label="Add a note" />
      <button class="btn btn-secondary" id="note-save">Save</button>
    </div>
    <div id="notes-list"></div>
  </section>

  <div class="ad-slot" data-ad="banner"><div class="ad-label">Advertisement</div></div>
</div></main>

<div id="toast-root" aria-live="polite"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/firebase.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/ads.js"></script>
<script>
(function () {
  var ui = SK.ui, api = SK.api, fb = SK.fb;
  var qp = function (k) { return new URLSearchParams(location.search).get(k); };
  var courseId = qp("course") || "", contentId = qp("content") || "";
  var user = null, pdfUrl = "", pdfTitle = "Document", pdf = null, page = 1, scale = null;
  ui.boot({ status: "Opening notes…" }).catch(function () {});
  ui.nav(); ui.telegram(); ui.telegramNag();
  document.getElementById("back-btn").addEventListener("click", function () {
    location.href = "content.html?id=" + courseId;
  });
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  fb.ensure().then(boot).catch(function () { fail("Sign-in service unreachable. Check connection and retry."); });
  ui.load(true);
  async function boot() {
    user = await fb.currentUser().catch(function () { return null; });
    if (!user) {
      var ok = await api.isFreePreview(courseId, contentId).catch(function () { return false; });
      if (!ok) {
        ui.toast("Sign in required", "First document is free — sign in for the rest");
        setTimeout(function () { location.href = "login.html?next=" + encodeURIComponent("pdf.html?course=" + courseId + "&content=" + contentId); }, 800);
        return;
      }
    }
    var key;
    try { key = await fb.mintKey(); }
    catch (e) { fail("Playback keys need the backend + Firebase."); return; }
    var d;
    try {
      var headers = await fb.authHeaders().catch(function () { return {}; });
      d = await api.play(courseId, contentId, key.key, key.deviceId, headers);
    }
    catch (e) { fail(e.message || e); return; }
    if (d.file_type !== undefined && d.file_type !== 1) { location.replace("play.html?course=" + courseId + "&content=" + contentId); return; }
    pdfTitle = d.title || pdfTitle; pdfUrl = d.file_url;
    document.getElementById("doc-title").textContent = pdfTitle;
    document.title = "StudiKitEZ — " + pdfTitle;
  SK.fb.presenceBeat(undefined, "reading · " + pdfTitle);
    try {
      pdf = await pdfjsLib.getDocument({ url: pdfUrl, withCredentials: false }).promise;
      await renderAll();
      if (user) fb.saveProgress(user.uid, courseId, contentId, { pct: 100, title: pdfTitle, type: "pdf", done: true }).catch(function () {});
      loadNotes();
      SK.ads.render();
      ui.load(false);
    } catch (e) { fail("Could not render this document — try Download."); }
  }
  function fail(msg) {
    document.getElementById("pdf-stage").innerHTML = '<div class="empty" style="border:0"><h3>Couldn\'t open this file</h3><p>' + ui.esc(msg) + '</p><button class="btn btn-primary btn-sm" onclick="location.reload()">Retry</button></div>';
  }
  document.getElementById("pdf-open").addEventListener("click", function () { if (pdfUrl) window.open(pdfUrl, "_blank", "noopener"); });
  document.getElementById("pdf-dl").addEventListener("click", async function () {
    if (!pdfUrl) return;
    var btn = this, old = btn.textContent;
    btn.disabled = true; btn.textContent = "Preparing…";
    try {
      var c = new AbortController();
      var timer = setTimeout(function () { c.abort(); }, 60000);
      var res = await fetch(pdfUrl, { signal: c.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error("HTTP " + res.status);
      var blob = await res.blob();
      var obj = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = obj; a.download = String(pdfTitle || "notes").replace(/[\\/:*?"<>|]/g, "").slice(0, 80) + ".pdf";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(obj); }, 5000);
      btn.textContent = "Saved ✓";
    } catch (e) {
      var a2 = document.createElement("a");
      a2.href = pdfUrl; a2.target = "_blank"; a2.rel = "noopener"; a2.download = pdfTitle + ".pdf";
      document.body.appendChild(a2); a2.click(); a2.remove();
      ui.toast("Direct link opened", "Site download blocked by the file host");
    }
    btn.disabled = false;
    setTimeout(function () { btn.textContent = old; }, 2500);
  });

  /* Per-page PDF: lazy render (only visible pages), free zoom per view,
     and a draw layer per page saved to THIS device's localStorage. */
  var rendered = {}, pageDims = {}, drawData = {}, drawOn = false, drawColor = "#111111", drawW = 4;
  var drawKey = "sk_pdf_draw_" + courseId + "_" + contentId;
  try { drawData = JSON.parse(localStorage.getItem(drawKey) || "{}") || {}; } catch (e) { drawData = {}; }
  function saveDraw() {
    try { localStorage.setItem(drawKey, JSON.stringify(drawData)); } catch (e) {
      try {
        var keys = Object.keys(drawData);
        while (keys.length > 2) { delete drawData[keys.shift()]; }
        localStorage.setItem(drawKey, JSON.stringify(drawData));
        ui.toast("Storage full", "Kept drawings for recent pages only");
      } catch (e2) {}
    }
  }
  function fitScale(pg, stageW) {
    var v0 = pg.getViewport({ scale: 1 });
    return Math.max(0.5, Math.min(2.5, (stageW - 40) / v0.width));
  }
  async function renderAll() {
    var stage = document.getElementById("pdf-stage");
    stage.innerHTML = "";
    rendered = {}; pageDims = {};
    document.getElementById("pg-total").textContent = pdf.numPages;
    document.getElementById("pdf-meta").textContent = pdf.numPages + " pages";
    for (var p = 1; p <= pdf.numPages; p++) {
      var holder = document.createElement("div");
      holder.className = "pdf-holder"; holder.id = "pdf-page-" + p;
      holder.dataset.page = p;
      var cv = document.createElement("canvas"); cv.className = "pdf-page"; holder.appendChild(cv);
      var ov = document.createElement("canvas"); ov.className = "draw-layer"; holder.appendChild(ov);
      var sk = document.createElement("div");
      sk.className = "skel"; sk.style.cssText = "position:absolute;inset:0;border-radius:6px";
      holder.appendChild(sk);
      stage.appendChild(holder);
      (function (pgNum, el) {
        pdf.getPage(pgNum).then(function (pg) {
          var v0 = pg.getViewport({ scale: 1 });
          pageDims[pgNum] = { w: v0.width, h: v0.height };
          el.style.aspectRatio = v0.width + " / " + v0.height;
          io.observe(el);
        }).catch(function () {});
      })(p, holder);
    }
    document.getElementById("pg-input").value = page;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      var p = Number(en.target.dataset.page);
      if (rendered[p]) { trackPage(p); return; }
      renderPage(p);
    });
  }, { rootMargin: "600px 0px" });
  function trackPage(p) {
    page = p;
    var inp = document.getElementById("pg-input");
    if (inp && document.activeElement !== inp) inp.value = p;
  }
  async function renderPage(p) {
    var holder = document.getElementById("pdf-page-" + p);
    if (!holder || rendered[p] === scale) return;
    rendered[p] = scale;
    try {
      var pg = await pdf.getPage(p);
      var s = scale === null ? fitScale(pg, document.getElementById("pdf-stage").clientWidth || 700) : scale;
      var vp = pg.getViewport({ scale: s });
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var cv = holder.querySelector("canvas.pdf-page");
      cv.width = vp.width * dpr; cv.height = vp.height * dpr;
      cv.style.width = "100%"; cv.style.height = "auto";
      holder.style.aspectRatio = vp.width + " / " + vp.height;
      await pg.render({ canvasContext: cv.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : undefined }).promise;
      var sk = holder.querySelector(".skel");
      if (sk) sk.remove();
      paintDraw(p);
      trackPage(p);
    } catch (e) { rendered[p] = null; }
  }
  function rerenderVisible() {
    Object.keys(rendered).forEach(function (k) { rendered[k] = null; });
    document.querySelectorAll(".pdf-holder").forEach(function (h) {
      var r = h.getBoundingClientRect();
      if (r.bottom > -400 && r.top < window.innerHeight + 400) renderPage(Number(h.dataset.page));
    });
  }
  /* ---- draw layer: strokes stored as fractions (zoom-independent) ---- */
  function paintDraw(p) {
    var holder = document.getElementById("pdf-page-" + p);
    if (!holder) return;
    var ov = holder.querySelector("canvas.draw-layer");
    var base = holder.querySelector("canvas.pdf-page");
    var W = base.clientWidth || holder.clientWidth || 300, H = base.clientHeight || W;
    ov.width = Math.max(1, Math.round(W)); ov.height = Math.max(1, Math.round(H));
    var ctx = ov.getContext("2d");
    ctx.clearRect(0, 0, ov.width, ov.height);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    (drawData[p] || []).forEach(function (st) {
      if (!st.pts || st.pts.length < 2) return;
      ctx.strokeStyle = st.c || "#111111"; ctx.lineWidth = Math.max(1, (st.w || 4) * (ov.width / 800));
      ctx.beginPath();
      ctx.moveTo(st.pts[0][0] * ov.width, st.pts[0][1] * ov.height);
      for (var i = 1; i < st.pts.length; i++) ctx.lineTo(st.pts[i][0] * ov.width, st.pts[i][1] * ov.height);
      ctx.stroke();
    });
    ov.classList.toggle("drawing", drawOn);
  }
  function bindDraw(ov, p) {
    if (ov._bound) return; ov._bound = true;
    var stroke = null;
    function pos(e) {
      var r = ov.getBoundingClientRect();
      var cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
      var cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
      return [Math.min(1, Math.max(0, (cx - r.left) / r.width)), Math.min(1, Math.max(0, (cy - r.top) / r.height))];
    }
    function start(e) {
      if (!drawOn) return;
      e.preventDefault();
      stroke = { c: drawColor, w: drawW, pts: [pos(e)] };
    }
    function move(e) {
      if (!stroke) return;
      e.preventDefault();
      stroke.pts.push(pos(e));
    }
    function end() {
      if (!stroke) return;
      if (!drawData[p]) drawData[p] = [];
      if (stroke.pts.length > 1) drawData[p].push({ c: stroke.c, w: stroke.w, pts: stroke.pts });
      stroke = null;
      saveDraw(); paintDraw(p);
    }
    ov.addEventListener("mousedown", start);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    ov.addEventListener("touchstart", start, { passive: false });
    ov.addEventListener("touchmove", move, { passive: false });
    ov.addEventListener("touchend", end);
  }
  var drawObs = new MutationObserver(function () {
    document.querySelectorAll(".pdf-holder canvas.draw-layer").forEach(function (ov) {
      var p = Number(ov.parentNode.dataset.page);
      bindDraw(ov, p);
      paintDraw(p);
    });
  });
  drawObs.observe(document.getElementById("pdf-stage"), { childList: true, subtree: true });
  document.getElementById("draw-toggle").addEventListener("click", function () {
    drawOn = !drawOn;
    this.classList.toggle("on", drawOn);
    this.setAttribute("aria-pressed", drawOn ? "true" : "false");
    document.getElementById("draw-tools").style.display = drawOn ? "flex" : "none";
    document.getElementById("draw-hint").style.display = drawOn ? "" : "none";
    document.querySelectorAll("canvas.draw-layer").forEach(function (ov) { ov.classList.toggle("drawing", drawOn); });
    ui.toast(drawOn ? "Draw mode on" : "Draw mode off", drawOn ? "Drag on any page to annotate" : "");
  });
  document.querySelectorAll("#draw-tools [data-c]").forEach(function (b) {
    b.addEventListener("click", function () {
      drawColor = b.dataset.c;
      document.querySelectorAll("#draw-tools [data-c]").forEach(function (x) { x.classList.toggle("on", x === b); });
    });
  });
  document.querySelectorAll("#draw-tools [data-w]").forEach(function (b) {
    b.addEventListener("click", function () {
      drawW = Number(b.dataset.w);
      document.querySelectorAll("#draw-tools [data-w]").forEach(function (x) { x.classList.toggle("on", x === b); });
    });
  });
  document.getElementById("draw-clear").addEventListener("click", function () {
    delete drawData[page];
    saveDraw(); paintDraw(page);
    ui.toast("Page cleared", "Drawings on page " + page + " erased");
  });
  window.addEventListener("resize", function () {
    clearTimeout(window._pdfRs);
    window._pdfRs = setTimeout(function () {
      document.querySelectorAll(".pdf-holder").forEach(function (h) { paintDraw(Number(h.dataset.page)); });
    }, 250);
  });
  function go(d) {
    page = Math.min(Math.max(1, page + d), pdf ? pdf.numPages : 1);
    document.getElementById("pg-input").value = page;
    var el = document.getElementById("pdf-page-" + page);
    if (el) el.scrollIntoView();
  }
  document.getElementById("pg-prev").addEventListener("click", function () { go(-1); });
  document.getElementById("pg-next").addEventListener("click", function () { go(1); });
  document.getElementById("pg-input").addEventListener("change", function (e) {
    var n = parseInt(e.target.value, 10);
    if (!isNaN(n) && pdf) { page = Math.min(Math.max(1, n), pdf.numPages); }
    document.getElementById("pg-input").value = page;
    var el = document.getElementById("pdf-page-" + page);
    if (el) el.scrollIntoView();
  });
  document.getElementById("zoom-in").addEventListener("click", function () { scale = Math.min(3, (scale === null ? 1 : scale) + 0.2); rerenderVisible(); ui.toast("Zoom " + Math.round(scale * 100) + "%", ""); });
  document.getElementById("zoom-out").addEventListener("click", function () { scale = Math.max(0.5, (scale === null ? 1 : scale) - 0.2); rerenderVisible(); ui.toast("Zoom " + Math.round(scale * 100) + "%", ""); });
  document.getElementById("zoom-fit").addEventListener("click", function () { scale = null; rerenderVisible(); });
  document.addEventListener("keydown", function (e) {
    if (/INPUT|TEXTAREA/.test(e.target.tagName) || !pdf) return;
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });

  async function loadNotes() {
    var host = document.getElementById("notes-list");
    var notes = await fb.listNotes(courseId, contentId);
    host.innerHTML = notes.length ? "" : '<p class="muted" style="font-size:.85rem;margin-top:.5rem">No notes yet.</p>';
    notes.forEach(function (n) {
      var el = document.createElement("div");
      el.className = "note-row";
      el.innerHTML = '<span class="mono" style="font-size:.65rem;color:var(--primary-dark)"></span><div></div>';
      el.querySelector("span").textContent = n.at || "";
      el.querySelector("div").textContent = n.note || "";
      host.appendChild(el);
    });
  }
  document.getElementById("note-save").addEventListener("click", async function () {
    var t = document.getElementById("note-input").value.trim();
    if (!t) return;
    if (!user) { ui.toast("Sign in required", ""); return; }
    try {
      await fb.saveNote(courseId, contentId, "p" + page, t);
      document.getElementById("note-input").value = "";
      loadNotes(); ui.toast("Saved ✓", "");
    } catch (e) { ui.toast("Save failed", ""); }
  });
})();
</script>
</body>
</html>
